// Project-level build.gradle (android/build.gradle)

plugins {
    id("com.android.application") version '8.1.0' apply false  // Android Gradle Plugin version
    id("com.google.gms.google-services") version "4.3.15" apply false  // Google Services plugin version
    // Other plugins can be added here
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(":app")

    // Ensure all subprojects use Java 21
    tasks.withType(JavaCompile) {
        sourceCompatibility = JavaVersion.VERSION_17.toString()
        targetCompatibility = JavaVersion.VERSION_17.toString()
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
